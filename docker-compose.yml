version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:15
    container_name: afyalink-postgres
    environment:
      POSTGRES_DB: afyalink_main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_MULTIPLE_DATABASES: afyalink_auth,afyalink_patients,afyalink_referrals,afyalink_facilities,afyalink_messaging,afyalink_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - afyalink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: afyalink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - afyalink-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: afyalink-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - afyalink-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Services
  auth-service:
    build:
      context: ./afyalink/auth-service
      dockerfile: Dockerfile
    container_name: afyalink-auth-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/afyalink_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - afyalink-network
    restart: unless-stopped

  patient-service:
    build:
      context: ./afyalink/patient-service
      dockerfile: Dockerfile
    container_name: afyalink-patient-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/afyalink_patients
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - afyalink-network
    restart: unless-stopped
    volumes:
      - ./afyalink/patient-service:/app
      - /app/__pycache__

  referral-service:
    build:
      context: ./afyalink/referral-service
      dockerfile: Dockerfile
    container_name: afyalink-referral-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/afyalink_referrals
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - afyalink-network
    restart: unless-stopped

  facility-service:
    build:
      context: ./afyalink/facility-service
      dockerfile: Dockerfile
    container_name: afyalink-facility-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/afyalink_facilities
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - afyalink-network
    restart: unless-stopped

  messaging-service:
    build:
      context: ./afyalink/messaging-service
      dockerfile: Dockerfile
    container_name: afyalink-messaging-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/afyalink_messaging
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8084
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - afyalink-network
    restart: unless-stopped

  audit-service:
    build:
      context: ./afyalink/audit-service
      dockerfile: Dockerfile
    container_name: afyalink-audit-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/afyalink_audit
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8085
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - afyalink-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./afyalink/api-gateway
      dockerfile: Dockerfile
    container_name: afyalink-api-gateway
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - PATIENT_SERVICE_URL=http://patient-service:8082
      - REFERRAL_SERVICE_URL=http://referral-service:8083
      - FACILITY_SERVICE_URL=http://facility-service:8082
      - MESSAGING_SERVICE_URL=http://messaging-service:8084
      - AUDIT_SERVICE_URL=http://audit-service:8085
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - patient-service
      - referral-service
      - facility-service
      - messaging-service
      - audit-service
    networks:
      - afyalink-network
    restart: unless-stopped

  # Frontend Applications
  web-app:
    build:
      context: ./frontend/web-app
      dockerfile: Dockerfile
    container_name: afyalink-web-app
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=http://localhost:8084
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - afyalink-network
    restart: unless-stopped

  admin-portal:
    build:
      context: ./frontend/admin-portal
      dockerfile: Dockerfile
    container_name: afyalink-admin-portal
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    ports:
      - "3001:3000"
    depends_on:
      - api-gateway
    networks:
      - afyalink-network
    restart: unless-stopped

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: afyalink-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - afyalink-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: afyalink-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - afyalink-network
    restart: unless-stopped

  # Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: afyalink-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web-app
      - admin-portal
      - api-gateway
    networks:
      - afyalink-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

networks:
  afyalink-network:
    driver: bridge